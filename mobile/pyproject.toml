[project]
name = "mobile"
version = "0.1.0"
description = "DoorGuardian — мобильное приложение (Flet)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LK-best", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.3",
    "bleak>=1.0.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "flet-web>=1.0.3",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
# bundle id приложения = org + "." + product -> com.door.DoorGuardian
org = "com.door"
product = "DoorGuardian"
# имя готового файла: build/apk/DoorGuardian.apk
artifact = "DoorGuardian"
company = "DoorGuardian"
copyright = "Copyright (C) 2026 by DoorGuardian"

[tool.flet.app]
path = "src"
# точка входа: собирается src/main_2.py (а не шаблонный main.py из тестов)
module = "main_2"

# разрешения Android: без них приложение не увидит Bluetooth-устройства.
# BLUETOOTH/BLUETOOTH_ADMIN/ACCESS_FINE_LOCATION нужны до Android 12,
# BLUETOOTH_SCAN/BLUETOOTH_CONNECT — на Android 12 и новее.
[tool.flet.android.permission]
"android.permission.BLUETOOTH" = { maxSdkVersion = "30" }
"android.permission.BLUETOOTH_ADMIN" = { maxSdkVersion = "30" }
"android.permission.ACCESS_FINE_LOCATION" = { maxSdkVersion = "30" }
"android.permission.BLUETOOTH_SCAN" = { usesPermissionFlags = "neverForLocation" }
"android.permission.BLUETOOTH_CONNECT" = true
